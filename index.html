<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>보카 스터디</title>
    
    <!-- PWA 및 메타 태그 -->
    <meta name="description" content="사진/PDF로 직접 만드는 오프라인 지원 영어단어 4지선다 퀴즈 PWA (TOEIC® 시험 대비 지원)" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="보카 스터디" />
    
    <!-- 아이콘 및 매니페스트 -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 서비스 워커 등록 및 신선도 관리 (v8 - updateViaCache: 'none' 및 가시성 복귀 시 갱신 확인)
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        let swRegistration = null;

        const checkSwUpdate = () => {
          if (!swRegistration) return;
          if (typeof navigator.onLine === 'boolean' && !navigator.onLine) return;
          swRegistration.update().catch(err => {
            console.debug('[PWA] Service worker update check skipped or failed:', err);
          });
        };

        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then(reg => {
              swRegistration = reg;
              console.log('[PWA] Service Worker registered with scope:', reg.scope);
              // 로드 직후 즉시 최신 버전 확인
              checkSwUpdate();
            })
            .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
        });

        // 탭/앱 복귀 시 강제 리로드 없이 조용히 백그라운드 갱신 확인 (퀴즈/녹음 중단 방지)
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            checkSwUpdate();
          }
        });

        window.addEventListener('online', () => {
          checkSwUpdate();
        });
      }
    </script>
  </body>
</html>
